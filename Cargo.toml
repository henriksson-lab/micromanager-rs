[workspace]
resolver = "2"
members = [".", "mm-demo"]

[package]
name = "micromanager"
version = "0.4.0"
edition = "2021"
description = "Rust port of the MicroManager microscopy control framework"
license-file = "LICENSE.txt"
repository = "https://github.com/ripp/micromanager-rs"
exclude = ["mmCoreAndDevices/", "mm-demo/"]
homepage = "https://micro-manager.org/"

[features]
andor-sdk3 = []
aravis = ["dep:aravis"]
daheng = []
jai = []
picam = []
spot = []
tsi = []
twain = []
iidc = []
basler = ["dep:pylon-cxx"]
basler-stub = []
opencv = ["dep:opencv"]
# Pure-Rust Photometrics carriers (Linux). Default builds don't pull libc directly.
pvcam-native-pcie = ["dep:libc"]
pvcam-native-usb = ["dep:libc"]

[dependencies]
thiserror = "2"
libc = { version = "0.2", optional = true }
parking_lot = "0.12"
serde_json = "1"
aravis = { version = "0.11", optional = true }
pylon-cxx = { version = "0.4", optional = true }
opencv = { version = "0.98", default-features = false, features = ["videoio", "imgproc"], optional = true }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
pkg-config = "0.3"
